model = "gpt-5.5"
model_provider = "openai"

model_reasoning_effort = "medium"
sandbox_mode = "danger-full-access"
approval_policy = "never"
web_search = "live"

[agents]
max_threads = 6
max_depth = 1
job_max_runtime_seconds = 5400

[agents.primary_deploy_auditor]
description = "Audit and independently verify the official deployment result for local-run completion."
config_file = "agents/primary_deploy_auditor.toml"

[agents.portable_bundle_auditor]
description = "Audit final portable bundle outputs and final verification evidence, then gate success/failure."
config_file = "agents/portable_bundle_auditor.toml"


[mcp_servers.apdv1Deployer]
command = "../scripts/start-mcp-stdio.sh"

[mcp_servers.apdv1Deployer.env]
APDV1_API_BASE = "http://127.0.0.1:18084"
APDV1_MCP_ENABLE_DANGEROUS_TOOLS = "false"
